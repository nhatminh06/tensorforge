[project]
name = "tensorforge"
version = "0.1.0"
description = "Analytical AI-accelerator performance modeling toolkit for GEMM, Transformer, and Conv2D workloads"
requires-python = ">=3.12"

[project.optional-dependencies]
ops = ["mlflow>=2.20"]
benchmark = ["torch>=2.4"]
onnx = ["onnxruntime>=1.18", "torch>=2.4"]

[project.scripts]
tensorforge-ops = "tensorforge_ops.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
